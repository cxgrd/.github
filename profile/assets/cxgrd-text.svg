<svg width="220" height="54" viewBox="0 0 220 54" xmlns="http://www.w3.org/2000/svg" role="img" aria-label=">CXGRD">
    <defs>
        <linearGradient id="cxgrdGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0fa870" />
            <stop offset="50%" stop-color="#149aae" />
            <stop offset="100%" stop-color="#674db3" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <clipPath id="typewriter">
            <rect x="92" y="8" height="38" width="0">
                <animate attributeName="width"
                    values="0;12;24;36;48;60;60;0"
                    keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1"
                    dur="3.2s"
                    calcMode="discrete"
                    repeatCount="indefinite" />
            </rect>
        </clipPath>
    </defs>

    <rect width="220" height="54" fill="#000000" />

    <!-- static prompt symbol, never clipped -->
    <text x="66" y="35" font-family="ui-monospace, SFMono-Regular, monospace"
          font-size="20" font-weight="700"
          fill="#149aae" filter="url(#glow)">&gt;</text>

    <!-- typed word, anchor=start so x is predictable -->
    <text x="92" y="35" text-anchor="start"
          font-family="ui-monospace, SFMono-Regular, monospace"
          font-size="20" font-weight="700"
          fill="url(#cxgrdGradient)"
          filter="url(#glow)"
          clip-path="url(#typewriter)">CXGRD</text>

    <!-- cursor: 8 positions matching the 8 clip keyframes above -->
    <!-- <rect y="17" width="2.5" height="22" fill="#149aae" rx="1">
        <animate attributeName="x"
            values="94;104;116;128;140;152;152;92"
            keyTimes="0;0.14;0.28;0.42;0.56;0.7;0.85;1"
            dur="3.2s"
            calcMode="discrete"
            repeatCount="indefinite" />
        <animate attributeName="opacity"
            values="1;0;1"
            dur="0.75s"
            repeatCount="indefinite" />
    </rect> -->
</svg>